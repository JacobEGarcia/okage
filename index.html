<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>OKAGE - a daily ritual</title>
<style>
  html,body{margin:0;padding:0;background:#12100d;color:#f3ead8;font-family:Georgia,serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;}
  #top{width:100%;max-width:1060px;display:flex;justify-content:space-between;align-items:baseline;padding:18px 26px 10px;}
  .wordmark{font-size:13px;letter-spacing:.42em;text-transform:uppercase;color:#c9962e;}
  #stamp{font-size:10px;letter-spacing:.24em;color:#7a6a4a;text-transform:uppercase;}
  #wrap{position:relative;width:min(96vw,1000px);}
  canvas#game{width:100%;display:block;border-radius:3px;background:#12100d;}
  .hidden{display:none !important;}
  .overlay{position:absolute;inset:0;display:flex;align-items:flex-end;justify-content:center;pointer-events:none;}
  .card{position:relative;background:#f3ead8;color:#221c14;border-radius:3px;padding:26px 34px 22px;text-align:center;max-width:430px;margin-bottom:34px;box-shadow:0 18px 60px rgba(0,0,0,.55);}
  .card .k{font-size:9px;letter-spacing:.34em;text-transform:uppercase;color:#8a6a2a;margin-bottom:10px;}
  .card h1{font-size:19px;font-weight:normal;letter-spacing:.06em;line-height:1.5;margin:0 0 12px;font-style:italic;}
  .card .sub{font-size:10px;letter-spacing:.3em;text-transform:uppercase;color:#6a5a34;}
  .card .btnrow{margin-top:14px;display:flex;gap:10px;justify-content:center;pointer-events:auto;}
  .go{background:#c9962e;color:#12100d;border:none;font-family:Georgia,serif;font-size:11px;letter-spacing:.28em;text-transform:uppercase;padding:10px 22px;cursor:pointer;border-radius:2px;}
  .alt{background:none;color:#6a5a34;border:1px solid #b09a5e;font-family:Georgia,serif;font-size:11px;letter-spacing:.28em;text-transform:uppercase;padding:10px 22px;cursor:pointer;border-radius:2px;}
  .hanko{position:absolute;top:-13px;right:-13px;width:36px;height:36px;background:#9e2b1e;color:#f3ead8;display:flex;align-items:center;justify-content:center;font-size:20px;border-radius:4px;transform:rotate(-4deg);box-shadow:0 1px 0 rgba(0,0,0,.15);opacity:.92;}
  .vert{position:absolute;left:18px;top:96px;writing-mode:vertical-rl;font-size:15px;letter-spacing:.5em;color:#6a5a34;user-select:none;}
  #hint{text-align:center;font-size:11px;letter-spacing:.3em;text-transform:uppercase;color:#8a7440;padding:12px 0 4px;min-height:16px;}
  #wish{text-align:center;font-size:14px;font-style:italic;color:#dcbb6e;min-height:18px;padding:2px 0 0;opacity:0;transition:opacity .6s;}
  #wish.show{opacity:1;}
  footer{padding:14px 0 26px;font-size:8.5px;letter-spacing:.26em;text-transform:uppercase;color:#5a4a24;text-align:center;}
  footer a{color:#8a7440;text-decoration:none;border-bottom:1px dotted #5a4a24;}
</style>
</head>

<footer>the voice assistant that brings you luck - <a href="https://jacobegarcia.github.io/luckycat/">join the wishlist</a></footer>
<script>
'use strict';
// ---------------- seeded daily ritual ----------------

const KANJI=[

"\u958b","\u6708","\u6b69","\u706f","\u798f","\u89e3","\u53cb","\u52dd",
"\u7a4d","\u5fdc","\u97ff","\u4fe1","\u62db","\u5f85","\u660e","\u6e80"

const kanjiIdx=qs.get('kanji')!=null?Math.max(0,Math.min(23,+qs.get('kanji')||0)):blessIdx;
// the tanzaku's monthly kigo - one wind-words for each month of the year, inked on the furin's paper strip
const POEM=['初音','雪解','春風','花風','青嵐','夕立','風鈴','涼風','初風','秋風','木枯','凩'];

// streak
const dayKey=seedStr;

const yestKey=yest.getFullYear()+'-'+(yest.getMonth()+1)+'-'+yest.getDate();

if(qs.get('omamori')){ omamori=+qs.get('omamori')||0; omamoriNew=true; }

// ---------------- canvas ----------------
const cv=document.getElementById('game'), ctx=cv.getContext('2d');

addEventListener('resize',resize); resize();

const INK='#12100d', PAPER='#f3ead8', GOLD='#c9962e', GOLDL='#e8c26a', RED='#9e2b1e', WOOD='#3a2a18', WOODD='#241a10';

const S={ t:0, state:'arrive', coinT:-1, ringT:-1, ackT:-1, ropeA:0, ropeV:0, glow:0, parts:[], leaves:[], chirpT:2, furinT:4, furinGust:0, emaSw:{}, glintT:-1, wasMoving:false, glanceT:-1, glanceX:0, glanceY:0, slideT:-1, slideCD:-99, slideSide:1, strollT:-1, strollCD:-99, chimeT:-1, firstSnow:true };
const slidePin=(''+(qs.get('slide')||'')).charAt(0)==='p'?parseFloat(qs.get('slide').slice(1)):-1; // QA: pin the slide at an exact phase
if(qs.get('slide')!=null&&slidePin<0){ S.slideT=+qs.get('slide')||0; S.slideSide=qs.get('side')==='-1'?-1:1; }
const strollPin=(''+(qs.get('stroll')||'')).charAt(0)==='p'?parseFloat(qs.get('stroll').slice(1)):-1; // QA: pin the stroll at an exact phase
if(qs.get('stroll')!=null&&strollPin<0){ S.strollT=+qs.get('stroll')||0; }
if(qs.get('glow')!=null){ S.glow=+qs.get('glow')||0; }
const chimePin=(''+(qs.get('chime')||'')).charAt(0)==='p'?parseFloat(qs.get('chime').slice(1)):-1; // QA: pin a chime's age
if(qs.get('chime')!=null&&chimePin<0){ S.chimeT=+qs.get('chime')||0; }
if(qs.get('smoke')!=null){ S.state='done'; S.ackT=Math.max(.001,S.t-(+qs.get('smoke')||0)); } // QA: ritual done; bake frames to age the smoke
const groomPh=mulberry32(seedNum^0x6770)()*53; // the day's grooming moment on a slow 53s cycle
const groomPin=qs.get('groom')!=null?parseFloat(qs.get('groom')):-1; // QA: pin the wipe at an exact phase
if(groomPin>=0){ S.state='done'; if(S.ackT<0) S.ackT=.001; }
const dripPin=qs.get('drip')!=null?parseFloat(qs.get('drip')):-1; // QA: pin the eave drip's phase
const dripOff=mulberry32(seedNum^0x6d19)();
// susuki - pampas grass by the path for the moon-viewing season, day-seeded clump
const susukiOn=qs.get('susuki')!=null?+qs.get('susuki')>0:season==='autumn';
const susukiStems=[];
{ const r0=mulberry32(seedNum^0x5055), n=6+Math.floor(r0()*3);
  for(let i=0;i<n;i++) susukiStems.push({x:78+i*13+r0()*8,h:52+r0()*34,ph:r0()*7,lean:(r0()-.5)*9}); }
// a moth visits the right lantern on calm, dry nights - seeded per day
const mothNight=qs.get('moth')!=null?+qs.get('moth')>0:mulberry32(seedNum^0x6a77)()<.6;
const mothPh=mulberry32(seedNum^0x6a78)()*7;
// real synodic phase (29.5306d from the 2000-01-06 new moon); fullK ~1 for the nights around full
function moonPhase(){ return qs.get('moon')!=null?+qs.get('moon'):(((2440587.5+Date.now()/864e5-2451550.26)/29.530588853)%1+1)%1; }
const MP=moonPhase();
addEventListener('pointermove',e=>{ const r=document.getElementById('game').getBoundingClientRect(); S.mx=(e.clientX-r.left)*(W/r.width); S.my=(e.clientY-r.top)*(H/r.height); });
const fullK=Math.min(1,Math.max(0,(((1-Math.cos(2*Math.PI*MP))/2)-.88)/.12));
// rain nights - seeded by the day, about one in three; ?rain=0..1 forces
const rainK=qs.get('rain')!=null?+qs.get('rain'):(mulberry32(seedNum^0x42a1)()<.32?.55+mulberry32(seedNum^0x77e1)()*.45:0);
// a rain-night puddle by the path - mirrors moon and lanterns, rings with the drips
const puddleOn=qs.get('puddle')!=null?+qs.get('puddle')>0:rainK>.15;
const ripplePin=qs.get('ripple')!=null?parseFloat(qs.get('ripple')):-1; // QA: pin a ripple ring's phase
const puddleR=mulberry32(seedNum^0x9dd1);
const puddleX=300+puddleR()*36, puddlePh=puddleR()*7;
// higanbana - red spider lilies bloom at the autumn equinox, a cluster by the path's end
const higanOn=qs.get('higan')!=null?+qs.get('higan')>0:season==='autumn';
const higanR=mulberry32(seedNum^0x4641);
const higanStems=[]; { const n=5+Math.floor(higanR()*3);
  for(let i=0;i<n;i++) higanStems.push({x:848+i*11+higanR()*6,h:26+higanR()*14,ph:higanR()*7}); }
// the first lily - one pioneer stem by the puddle, only in higan week (the 7 days around the equinox)
const lilyOn=qs.get('lily')!=null?+qs.get('lily')>0:(higanOn&&today.getMonth()===8&&today.getDate()>=20&&today.getDate()<=26);
// kinmokusei - a fragrant olive branch enters from the upper left, in bloom for the equinox weeks
const kinOn=qs.get('kin')!=null?+qs.get('kin')>0:season==='autumn';
const kinR=mulberry32(seedNum^0x8a3d);
const kinClusters=[]; { const n=3+Math.floor(kinR()*2);
  for(let i=0;i<n;i++) kinClusters.push({t:.46+i*(.48/n)+kinR()*.06, ph:kinR()*7, s:.8+kinR()*.5}); }
const kinPetalR=mulberry32(seedNum^0x8a3e);
const kinPetal={ph:kinPetalR()*7, cyc:11+kinPetalR()*7, dur:5+kinPetalR()*2};
// a spider's orb web in the kinmokusei fork - autumn diligence, dew catching the moonlight
const webOn=qs.get('web')!=null?+qs.get('web')>0:season==='autumn';
const webR=mulberry32(seedNum^0x7c2f);
const webDew=[]; for(let i=0;i<6;i++) webDew.push({a:webR()*6.283, r:6+webR()*9, ph:webR()*7});
// hoshi furu - one shooting star per visit, day-seeded into the night; if she is home she glances up at it
const shootR=mulberry32(seedNum^0x570a);
let shootAt=18+shootR()*50; const shootX=140+shootR()*620, shootY=36+shootR()*70, shootDir=shootR()<.5?-1:1;
const shootPin=qs.get('shoot')!=null?parseFloat(qs.get('shoot')):-1; // QA: pin the streak's age
S.shootT=-1;
// a heron crosses the bright moon - one slow pass on the luminous nights, day-seeded
const heronOn=qs.get('heron')!=null?+qs.get('heron')>0:fullK>.45;
const heronPin=qs.get('heronage')!=null?parseFloat(qs.get('heronage')):-1; // QA: pin the crossing's age
const heronR=mulberry32(seedNum^0x3e07);
const heronT0=5+heronR()*22, heronDY=(heronR()-.5)*56;
// akatonbo - the red dragonfly of autumn evenings; patrols the yard, perches on a susuki plume and the offering-box corner, and she watches it pass
const tonboOn=qs.get('tonbo')!=null?+qs.get('tonbo')>0:(season==='autumn'&&rainK<.2&&mulberry32(seedNum^0x70b0)()<.7);
const tonboPin=qs.get('tonboage')!=null?parseFloat(qs.get('tonboage')):-1; // QA: pin the cycle position
const tonboR=mulberry32(seedNum^0x70b1);
const tonboPh=tonboR()*52;
const tonboSpots=[[116,groundY()-138],[556,groundY()+2]]; // a susuki plume tip, then the box's near corner beside her // a susuki plume tip, then the box corner beside her
// tsukimi dango - on the full-moon autumn nights a small offering appears by the box
const dangoOn=qs.get('dango')!=null?+qs.get('dango')>0:(season==='autumn'&&fullK>.5);
// a maple leaf rides her head for a while on autumn nights - day-seeded when tonight's drifts down
const leafHeadOn=qs.get('momiji')!=null?+qs.get('momiji')>0:season==='autumn';
const leafPin=qs.get('leafage')!=null?parseFloat(qs.get('leafage')):-1; // QA: pin the resting leaf's age
const leafR=mulberry32(seedNum^0x1eaf);
const leafT0=7+leafR()*16, leafTilt=(leafR()-.5)*.9;
// the old pond's frog - on rain nights it sits by the puddle and hops now and then
const frogOn=qs.get('frog')!=null?+qs.get('frog')>0:(puddleOn&&season!=='winter');
const hopPin=qs.get('hop')!=null?parseFloat(qs.get('hop')):-1; // QA: pin a hop's age
const frogFR=mulberry32(seedNum^0xf406);
const frogSpots=[[-64,4],[-30,16],[10,8],[58,2]].map(d=>[puddleX+d[0]+(frogFR()*8-4),groundY()+96+d[1]+(frogFR()*4-2)]);
// her breath shows on the coldest winter nights - slow warm puffs against the dark, day-seeded rhythm
const breathOn=qs.get('breath')!=null?+qs.get('breath')>0:(season==='winter'&&mulberry32(seedNum^0xb6e4)()<.65);
const breathPin=qs.get('breathage')!=null?parseFloat(qs.get('breathage')):-1; // QA: pin the exhale's age
const breathPh=mulberry32(seedNum^0xb6e5)()*4.2;
// hatsushimo - the first frost rims the camphor bough on the same coldest nights her breath shows
const frostOn=qs.get('frost')!=null?+qs.get('frost')>0:(season==='winter'&&mulberry32(seedNum^0xb6e4)()<.65);
const camR=mulberry32(seedNum^0xca9f);
const camClusters=[]; { for(let i=0;i<4;i++) camClusters.push({t:.3+i*.21+camR()*.07, ph:camR()*7, s:.85+camR()*.4}); }
// kadomatsu - pine-and-bamboo at the path for the first seven days of January, welcoming the year in
const kadoOn=qs.get('kado')!=null?+qs.get('kado')>0:(today.getMonth()===0&&today.getDate()<=7);
if(doneToday){ S.state='done'; S.glow=1; }
if(qs.get('stage')==='offered'){ S.state='offered'; }
if(qs.get('stage')==='done'){ S.state='done'; S.glow=1; setTimeout(showBlessing,600); }

// ---------------- audio ----------------
let AC=null, muted=false;
function audio(){ try{ if(!AC) AC=new (window.AudioContext||window.webkitAudioContext)(); if(AC.state==='suspended') AC.resume(); return AC; }catch(e){ return null; } }
function tone(f0,f1,dur,type,vol,when){ if(muted||!AC) return; const t=AC.currentTime+(when||0);
  const o=AC.createOscillator(), g=AC.createGain(); o.type=type; o.frequency.setValueAtTime(Math.max(30,f0),t);
  if(f1&&f1!==f0) o.frequency.exponentialRampToValueAtTime(Math.max(30,f1),t+dur);
  g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t+dur+.05); }
function sfxBell(){ tone(1180,1180,.9,'sine',.06); tone(3257,3257,.6,'sine',.026); tone(2400,2400,.05,'triangle',.035); }
function sfxClink(){ tone(2400,2400,.06,'triangle',.05); tone(3600,3400,.05,'sine',.03,.03); }
function sfxSwish(){ tone(300,180,.18,'sine',.03); }
function sfxDrone(){ tone(110,110,2.4,'sine',.028); tone(165,164,2.4,'sine',.02,.1); tone(220,219,2,'sine',.012,.2); }
let rainG=null;
function rainSet(k){ if(!AC) return; if(muted) k=0;
  if(!rainG){ const len=AC.sampleRate*2, buf=AC.createBuffer(1,len,AC.sampleRate), d=buf.getChannelData(0);
    for(let i=0;i<len;i++) d[i]=Math.random()*2-1;
    const src=AC.createBufferSource(); src.buffer=buf; src.loop=true;
    const f=AC.createBiquadFilter(); f.type='bandpass'; f.frequency.value=1500; f.Q.value=.45;
    rainG=AC.createGain(); rainG.gain.value=0; src.connect(f); f.connect(rainG); rainG.connect(AC.destination); src.start(); }
  rainG.gain.setTargetAtTime(k,AC.currentTime,.5); }

// ---------------- scene ----------------
function groundY(){ return 470; }

const _MIX=(a,b,t)=>[a[0]+(b[0]-a[0])*t, a[1]+(b[1]-a[1])*t, a[2]+(b[2]-a[2])*t];
const _CSS=c=>'rgb('+Math.round(c[0])+','+Math.round(c[1])+','+Math.round(c[2])+')';
function drawSky(){
  const dk=S.glow; // the ritual brings the morning
  const g=ctx.createLinearGradient(0,0,0,groundY());
  const fk=fullK*.85;
  g.addColorStop(0,_CSS(_MIX(_MIX([10,9,8],[15,19,30],fk),[36,32,50],dk)));
  g.addColorStop(.7,_CSS(_MIX(_MIX([22,19,14],[27,31,42],fk),[70,48,36],dk)));
  g.addColorStop(1,_CSS(_MIX(_MIX([28,23,16],[38,40,48],fk),[146,86,40],dk)));
  ctx.fillStyle=g; ctx.fillRect(0,0,W,groundY());
  if(dk>0){ const hg=ctx.createRadialGradient(W*.24,groundY(),10,W*.24,groundY(),300);
    hg.addColorStop(0,'rgba(233,180,80,'+(.30*dk).toFixed(3)+')'); hg.addColorStop(1,'rgba(233,180,80,0)');
    ctx.fillStyle=hg; ctx.fillRect(0,groundY()-240,W,240); }
  // stars (seeded, slow twinkle)
  const rs=mulberry32(413);
  for(let i=0;i<70;i++){ const x=rs()*W, y=rs()*300, tw=.25+.55*Math.abs(Math.sin(S.t*.7+i*2.1));
    ctx.fillStyle='rgba(239,228,200,'+(tw*.5*(1-dk*.75)*(1-rainK*.7)).toFixed(3)+')'; ctx.fillRect(x,y,1.3,1.3); }
  // hoshi furu - one bright streak, once a night; the rain hides it
  { const sa=shootPin>=0?shootPin:(S.shootT>=0?S.t-S.shootT:-1);
    if(sa>=0&&sa<.9){ const k=sa/.9, al=Math.sin(k*Math.PI)*(1-rainK*.7);

function tonboPos(t){ // the dragonfly's round: patrol figure-eights, two perches a cycle, eased in and out
  const c=((t%52)+52)%52, pw=[[20,32],[40,49]];
  let perched=-1, pe=0;
  for(let i=0;i<2;i++){ const a=pw[i][0], b=pw[i][1];
    if(c>=a-1.6&&c<=b+1.6){ perched=i; pe=Math.min(1,(c-a+1.6)/1.6)*Math.min(1,(b+1.6-c)/1.6); pe=pe*pe*(3-2*pe); break; } }
  const a=t*.42+tonboPh;
  const fx=500+Math.cos(a)*305, fy=groundY()-118+Math.sin(a*2)*52+Math.sin(t*1.7)*4;
  if(perched>=0){ const sp=tonboSpots[perched]; return {x:fx+(sp[0]-fx)*pe, y:fy+(sp[1]-fy)*pe, pe, perched}; }
  return {x:fx,y:fy,pe:0,perched:-1};
}

    : 'the cat keeps the night - return tomorrow';
}
function offer(){ if(S.state!=='arrive') return; S.state='offered'; S.coinT=S.t; sfxSwish(); setTimeout(sfxClink,460);
  for(let i=0;i<10;i++) S.parts.push({x:W/2-16+Math.random()*32,y:groundY()+2,vx:0,vy:0,s:2,ttl:.6,col:GOLDL}); setHint(); }
function ring(){ if(S.state!=='offered'&&S.state!=='done') return;
  S.ropeV=2.6; sfxBell();
  if(S.state==='offered'){ S.state='done'; S.ackT=S.t;
    streak=(lastDay===yestKey)?streak+1:(doneToday?streak:1); lastDay=dayKey; LSset('okage_streak',streak); LSset('okage_last',dayKey);
    if(streak>0 && streak%7===0 && !doneToday){ omamori++; omamoriNew=true; LSset('okage_omamori',omamori); }
    sfxDrone(); setTimeout(showBlessing,1500); }
  setHint(); }
function showBlessing(){
  const kk=['the blessing of the day'];
  if(fullK>0.8) kk.push('\u6E80\u6708 full moon');
  if(rainK>0) kk.push('\u96E8 rain on the roof');
  document.getElementById('dk').textContent=kk.join(' - ');
  document.getElementById('dbless').textContent='\u201C'+BLESSINGS[blessIdx]+'\u201D';
  document.getElementById('dstreak').textContent='day '+streak+' of your ritual'+(streak>1?' - the cat remembers':'');
  if(omamori>0){ document.getElementById('domamo').classList.remove('hidden');
    document.getElementById('domamotx').textContent=omamoriNew?'the cat presses an omamori into your hand':'omamori x '+omamori+' - her protection travels with you'; }
  document.getElementById('done').classList.remove('hidden');
}
if(doneToday){ setTimeout(showBlessing,400); }

let wishT=null;
function showWish(i){
  const el=document.getElementById('wish');
  el.textContent='\u201C'+WISHES[i]+'\u201D';
  el.classList.add('show');
  if(wishT) clearTimeout(wishT);
  wishT=setTimeout(()=>el.classList.remove('show'),4600);
}
function hit(x,y){
  const r=cv.getBoundingClientRect(), px=(x-r.left)/r.width*W, py=(y-r.top)/r.height*H;
  const cx=W/2, gy=groundY();
  for(const e of (S.ema||[])){ if(Math.abs(px-e.x)<17 && py>e.y-2 && py<e.y+32){ showWish(e.w); S.ropeV=Math.max(S.ropeV,.5); S.emaSw[e.i]=Math.min(.6,(S.emaSw[e.i]||0)+.34); S.glanceT=S.t; S.glanceX=e.x; S.glanceY=e.y; return; } }
  if(S.state==='arrive'){ if(px>cx-80&&px<cx+80&&py>gy-10&&py<gy+56) offer(); else offer(); }
  else if(S.state==='offered'){ ring(); }
  else { S.ropeV=Math.max(S.ropeV,1.8); sfxBell(); }
}
cv.addEventListener('pointerdown',e=>{ audio(); hit(e.clientX,e.clientY); });
addEventListener('keydown',e=>{ if(e.code==='Space'||e.code==='Enter'){ e.preventDefault(); audio(); if(S.state==='arrive') offer(); else ring(); } });
document.getElementById('torun').onclick=()=>{ location.href='https://jacobegarcia.github.io/lucky-runner/'; };
document.getElementById('again2').onclick=()=>{ document.getElementById('done').classList.add('hidden'); };
setHint();

// ---------------- loop ----------------
let last=0;
function step(dt){ S.t+=dt;
  // one wind over the whole shrine - the furin's gust is the world's gust
  S.wind=Math.sin(S.t*.5)*.5+Math.sin(S.t*1.7)*.3+Math.sin(S.t*3.1)*.2;
  S.furinGust=Math.abs(S.wind);
  // a rare strong gust shakes a soft lump of snow loose from the downwind eave
  if(season==='winter'&&S.slideT<0&&Math.abs(S.wind)>.78&&S.t-S.slideCD>22){
    S.slideCD=S.t;
    if(mulberry32((seedNum^0x51de)+Math.floor(S.t*7))()<.3){ S.slideT=S.t; S.slideSide=S.wind>0?1:-1; }
  }
  // tapped ema plaques swing, then settle
  for(const k in S.emaSw){ S.emaSw[k]*=Math.pow(.35,dt); if(S.emaSw[k]<.012) delete S.emaSw[k]; }
  // rope physics - the wind breathes on the suzu rope even untouched
  S.ropeV+=(-S.ropeA*14+S.wind*.5)*dt; S.ropeV*=Math.pow(.4,dt); S.ropeA+=S.ropeV*dt;
  // suzu glint: the bell flashes once as a real swing settles back to rest
  const rv=Math.abs(S.ropeV);
  if(rv>=.42) S.wasMoving=true;
  else if(S.wasMoving&&rv<.3){ S.wasMoving=false; S.glintT=S.t; }
  if(S.glintT>=0&&S.t-S.glintT>1.2) S.glintT=-1;
  if(S.glanceT>=0&&S.t-S.glanceT>2.4) S.glanceT=-1;
  if(slidePin>=0){ S.slideT=S.t-slidePin; if(qs.get('side')==='-1') S.slideSide=-1; }
  if(S.slideT>=0&&S.t-S.slideT>3.4) S.slideT=-1; // spent lump - the roof can shed again
  // every so often she gets up, strolls to the ema rack, and rubs her cheek on the post
  if(S.strollT<0&&S.t>8&&S.t-S.strollCD>80&&mulberry32((seedNum^0x7a11)+Math.floor(S.t*3))()<.45){ S.strollT=S.t; S.strollCD=S.t; }
  if(strollPin>=0) S.strollT=S.t-strollPin;
  if(S.strollT>=0&&S.t-S.strollT>5.8) S.strollT=-1; // home again
  // hoshi furu - when the seeded moment comes and the sky is clear enough, she looks up
  if(S.shootT<0&&S.t>=shootAt){ if(rainK<.5){ S.shootT=S.t; if(S.glow>.5&&S.strollT<0){ S.glanceT=S.t; S.glanceX=shootX+shootDir*90; S.glanceY=shootY+40; } } else shootAt+=25; } // the rain postpones it; she notices only when awake
  if(shootPin>=0){ S.shootT=S.t-shootPin; if(shootPin<1&&S.glow>.5&&S.strollT<0&&S.glanceT<0){ S.glanceT=S.t-shootPin*.5; S.glanceX=shootX+shootDir*90; S.glanceY=shootY+40; } } // QA pin mirrors the glance
  // acknowledgment glow
  if(S.ackT>=0) S.glow=Math.min(1,S.glow+dt*.8);
  // once the ritual is done she grooms now and then - day-seeded phase on a slow cycle
  S.groomG = S.state==='done' ? (groomPin>=0?groomPin:((S.t+groomPh)%53)) : -1;
  // the moth flutters off when a gust picks up or the rain turns heavy
  const calm=Math.max(0,Math.min(1,1-(Math.abs(S.wind)-.25)/.25));
  const dry=Math.max(0,Math.min(1,1-(rainK-.25)/.3));
  S.mothA=qs.get('moth')!=null?(+qs.get('moth')>0?1:0):(mothNight?calm*dry:0); // lever pins it for QA
  // the maple leaf drifts down, rests, and leaves when she grooms or a hard gust passes
  if(leafHeadOn){
    if(S.leafSt==null){ S.leafSt=-1; S.leafT=0; }
    if(leafPin>=0){ S.leafSt=1; S.leafT=S.t-leafPin; }
    else {
      if(S.leafSt===-1&&S.t>leafT0){ S.leafSt=0; S.leafT=S.t; }
      if(S.leafSt===0&&S.t-S.leafT>2.6){ S.leafSt=1; S.leafT=S.t; }
      if(S.leafSt===1&&((S.groomG>=0&&S.groomG<4.5)||Math.abs(S.wind)>.82)){ S.leafSt=2; S.leafT=S.t; }
    }
  }
  // the frog keeps its own slow schedule, day-seeded
  if(frogOn){
    if(S.hopT==null){ S.hopT=-1; S.frogSpot=0; S.hopFrom=0; S.frogNext=4+frogFR()*6; S.frogSplashes=[]; }
    if(hopPin>=0){ S.hopFrom=0; S.frogSpot=1; S.hopT=S.t-hopPin;
      if(S.glow>.5&&S.strollT<0&&hopPin<2.2){ const sp=frogSpots[1]; S.glanceT=S.t-hopPin; S.glanceX=sp[0]; S.glanceY=sp[1]; } } // QA pin mirrors the glance
    else {
      if(S.hopT<0&&S.t>S.frogNext){ S.hopT=S.t; S.hopFrom=S.frogSpot; S.frogSpot=(S.frogSpot+1+Math.floor(mulberry32((seedNum^0xf407)+Math.floor(S.t*10))()*2))%frogSpots.length;
        if(S.glow>.5&&S.strollT<0){ const sp=frogSpots[S.frogSpot]; S.glanceT=S.t; S.glanceX=sp[0]; S.glanceY=sp[1]; } } // she notices the frog set off
      if(S.hopT>=0&&S.t-S.hopT>.6){ S.hopT=-1; S.frogNext=S.t+7+mulberry32((seedNum^0xf408)+Math.floor(S.t*10))()*12;
        const sp=frogSpots[S.frogSpot], dx=sp[0]-puddleX, dy=sp[1]-(groundY()+96);
        if(dx*dx+dy*dy*4<48*48){ S.frogSplashes.push({x:sp[0],y:sp[1],t:S.t});
          if(S.glow>.5&&S.strollT<0){ S.glanceT=S.t; S.glanceX=sp[0]; S.glanceY=sp[1]; } } } // and the sound of water
    }
    for(let i=S.frogSplashes.length-1;i>=0;i--) if(S.t-S.frogSplashes[i].t>1.2) S.frogSplashes.splice(i,1);
  }
  // she watches the dragonfly when it works her side of the yard
  if(tonboOn&&S.glow>.5&&S.strollT<0){ const tp=tonboPos(tonboPin>=0?tonboPin:S.t), tdx=tp.x-526, tdy=tp.y-340;
    if(tdx*tdx+tdy*tdy<150*150){ S.glanceT=S.t; S.glanceX=tp.x; S.glanceY=tp.y; } }
  // particles
  for(let i=S.parts.length-1;i>=0;i--){ const p=S.parts[i]; p.ttl-=dt; p.y-=20*dt; if(p.ttl<=0) S.parts.splice(i,1); }
  if(season==='spring' && Math.random()<dt*.6) S.leaves.push({k:'petal',x:W+20,y:-10+Math.random()*120,vy:14+Math.random()*10,ph:Math.random()*7,a:.5+Math.random()*.3,ttl:22});
  if(season==='autumn' && Math.random()<dt*.5) S.leaves.push({k:'leaf',x:W+20,y:-10,vy:22+Math.random()*18,ph:Math.random()*7,a:.4+Math.random()*.3,ttl:16});
  if(season==='winter' && Math.random()<dt*1.1){ const first=S.firstSnow; S.firstSnow=false;
    S.leaves.push(first?{k:'snow',first:true,x:Math.random()*(W+60)-30,y:-8,vy:11,ph:Math.random()*7,a:.95,ttl:40}
                        :{k:'snow',x:Math.random()*(W+60)-30,y:-8,vy:20+Math.random()*16,ph:Math.random()*7,a:.5+Math.random()*.35,ttl:26}); }
  if(season==='summer' && Math.random()<dt*.35 && S.leaves.length<14) S.leaves.push({k:'firefly',x:60+Math.random()*(W-120),y:groundY()-8-Math.random()*120,vy:-6-Math.random()*7,ph:Math.random()*7,a:1,ttl:12});
  for(let i=S.leaves.length-1;i>=0;i--){ const l=S.leaves[i]; l.ttl-=dt;
    if(l.k==='firefly'){ l.y+=l.vy*dt; l.x+=Math.sin(S.t*.9+l.ph)*14*dt; if(l.y<30) l.vy=Math.abs(l.vy)*.6; }
    else { l.y+=l.vy*dt; l.x-=(l.k==='snow'?8:26)*dt+Math.sin(S.t+l.ph)*10*dt; l.x+=Math.sin(S.t*1.6+l.ph)*16*dt*8; l.x+=(S.wind||0)*42*dt; }
    if(l.ttl<=0||l.x<-30||l.y>H+20) S.leaves.splice(i,1); }
  // furin chime on strong gusts - a scene event whether or not the sound is on
  S.furinT-=dt; if(S.furinT<=0){ S.furinT=6+Math.random()*9;
    if(S.furinGust>.5){ S.chimeT=S.t;
      if(AC&&!muted){ const f0=2900+Math.random()*900; tone(f0,f0,.5,'sine',.012); tone(f0*1.5,f0*1.5,.4,'sine',.008,.1); } } }
  if(chimePin>=0) S.chimeT=S.t-chimePin;
  // rain bed + roof drips
  if(AC) rainSet(rainK*.05);
  if(AC&&!muted&&rainK>0){ S.dripT=(S.dripT||2.5)-dt; if(S.dripT<=0){ S.dripT=2+Math.random()*5; tone(2100+Math.random()*600,1600,.05,'sine',.004); } }
  // crickets
  if(AC&&!muted){ S.chirpT-=dt; if(S.chirpT<=0){ S.chirpT=1.6+Math.random()*2.8; tone(4300,4300,.03,'sine',.004); tone(4600,4600,.03,'sine',.003,.09); } }
}
function frame(ts){
  const dt=Math.min(.05,(ts-last)/1000||0); last=ts; step(dt);
  draw();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// ---------------- QA ----------------
window.onerror=(m,src,l)=>{ window.__err='ERR '+m+' @'+l; };
if(qs.get('probe')){
  const n=+(qs.get('frames')||120);
  for(let i=0;i<n;i++) step(1/60);
  if(qs.get('act')==='offer') offer();
  if(qs.get('act')==='ring'){ offer(); ring(); }
  if(qs.get('act')==='ema'){ draw(); if(S.ema&&S.ema.length){ showWish(S.ema[0].w); window.__wish=S.ema[0].w; } }
  if(qs.get('act')) for(let i=0;i<40;i++) step(1/60);
  if(qs.get('glint')){ S.ropeV=2.6; S.wasMoving=true;
    let gd=0; while(S.glintT<0&&gd++<900) step(1/60);
    for(let i=0;i<33;i++) step(1/60); }
  if(qs.get('tap')!=null){ draw(); const ti=+qs.get('tap');
    if(S.ema&&S.ema[ti]){ S.emaSw[S.ema[ti].i]=.5; window.__wish=S.ema[ti].w; S.glanceT=S.t; S.glanceX=S.ema[ti].x; S.glanceY=S.ema[ti].y; }
    for(let i=0;i<9;i++) step(1/60); }
  document.title='PROBE '+JSON.stringify({state:S.state,streak,doneToday,blessIdx,season,omamori,ema:(S.ema||[]).length,wish:window.__wish!=null?window.__wish:-1,moon:+MP.toFixed(3),full:+fullK.toFixed(2),rain:+rainK.toFixed(2),glow:+S.glow.toFixed(2),glint:S.glintT>=0?+(S.t-S.glintT).toFixed(2):-1,slide:S.slideT>=0?+(S.t-S.slideT).toFixed(2):-1,stroll:S.strollT>=0?+(S.t-S.strollT).toFixed(2):-1,chime:S.chimeT>=0?+(S.t-S.chimeT).toFixed(2):-1,fs:S.firstSnow?0:1,smoke:S.state==='done'?+(S.ackT>=0?S.t-S.ackT:S.t+40).toFixed(2):-1,groom:S.groomG>=0?+S.groomG.toFixed(2):-1,drip:(rainK>0||dripPin>=0)?+((dripPin>=0?dripPin:(S.t*.42+dripOff))%1).toFixed(2):-1,moth:+(S.mothA||0).toFixed(2),susuki:susukiOn?1:0,puddle:puddleOn?1:0,frog:frogOn?1:0,momiji:S.leafSt===1?+(S.t-S.leafT).toFixed(2):(S.leafSt!=null?S.leafSt:-1),dango:dangoOn?1:0,heron:heronOn?1:0,higan:higanOn?1:0,lily:lilyOn?1:0,kin:kinOn?1:0,web:webOn?1:0,tonbo:tonboOn?+((tonboPin>=0?tonboPin:S.t)%52).toFixed(1):0,breath:breathOn?+((breathPin>=0?breathPin:(S.t+breathPh)%4.2)).toFixed(2):0,frost:frostOn?1:0,kado:kadoOn?1:0,poem:poemIdx,shoot:shootPin>=0?shootPin:(S.shootT>=0?+(S.t-S.shootT).toFixed(2):-1),err:window.__err||''});
  draw();
}
</script>
